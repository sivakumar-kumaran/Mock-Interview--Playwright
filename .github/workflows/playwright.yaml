name: Mock-Interview Schedule

on:
 push:
  branches:
    - main

 pull_request:
  branches:
   - main

 schedule:
   - cron: '0 18 * * *'

jobs:
  smoke-testing:
      runs-on : ubuntu-latest

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
        - run: npm ci
        - run: npx playwright install --with-deps chromium
        - run: npx playwright tests/smokeTest/Loginpage.spec.js
        - run: npx playwright tests/smokeTest/Register.spec.js
        - run: npx playwright tests/smokeTest/InterviewTest.spec.js
