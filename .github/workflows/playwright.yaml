name: Mock-Interview Schedule

on:
 push:
  branches:
    - main

 pull_request:
  branches:
   - main

 schedule:
   - cron: '0 6 * * *'

jobs:
  smoke-testing:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4.2.1
        - uses: actions/setup-node@v4.1.0
          with:
            node-version: 22
            cache: npm
        - run: npm ci
        - run: npx playwright install --with-deps chromium
        - run: npx playwright test tests/smokeTest/Loginpage.spec.js --project=chromium
        - run: npx playwtight test tests/smokeTest/Register.spec.js --project=chromium 


 